<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub QoL</title>
    <link rel="stylesheet" href="css/outputTailwind.css" />
    <style>
      /* Master toggle off: the feature controls are inert. */
      body:has(#gqol-master-toggle:not(:checked)) #features {
        opacity: 0.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="w-[340px] min-w-[340px] bg-zinc-950 font-sans text-zinc-100 antialiased">
    <div class="flex flex-col gap-4 p-4">
      <header class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <h1 class="text-base font-semibold text-zinc-50">GitHub QoL</h1>
          <p class="text-xs leading-relaxed text-zinc-500">
            Quality-of-life tweaks for GitHub pull requests.
          </p>
        </div>
        <label
          class="inline-flex cursor-pointer items-center py-1"
          title="Turn GitHub QoL on or off on PR pages"
        >
          <input
            id="gqol-master-toggle"
            data-setting="enabled"
            type="checkbox"
            class="peer sr-only"
          />
          <span
            class="relative h-6 w-11 rounded-full bg-zinc-700 transition-colors after:absolute after:left-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-transform peer-checked:bg-blue-500 peer-checked:after:translate-x-5 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-500/30"
          ></span>
          <span class="sr-only">Enable GitHub QoL</span>
        </label>
      </header>

      <fieldset id="features" class="space-y-3 rounded-lg border border-zinc-800 bg-zinc-900/40 px-3 py-3">
        <legend class="sr-only">Features</legend>

        <div class="space-y-0.5">
          <span class="block text-sm font-medium text-zinc-200">Timeline direction</span>
          <span class="block text-xs leading-snug text-zinc-500">
            Set newest/oldest first on the settings page.
          </span>
        </div>

        <label class="flex cursor-pointer gap-3">
          <input
            data-setting="collapsePrDescription"
            type="checkbox"
            class="mt-0.5 size-4 shrink-0 rounded border-zinc-600 bg-zinc-950 text-blue-500 focus:ring-2 focus:ring-blue-500/30"
          />
          <span class="min-w-0 space-y-0.5">
            <span class="block text-sm font-medium text-zinc-200">Collapse PR description</span>
            <span class="block text-xs leading-snug text-zinc-500">
              Show a short preview; click to expand the full description.
            </span>
          </span>
        </label>
      </fieldset>

      <button
        id="open-options"
        class="w-full rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 hover:border-zinc-500"
      >
        Open settings
      </button>

      <p id="popup-status" class="min-h-[1rem] text-center text-[10px] text-zinc-600" aria-live="polite"></p>
    </div>

    <script type="module" src="js/popup.min.js"></script>
  </body>
</html>
